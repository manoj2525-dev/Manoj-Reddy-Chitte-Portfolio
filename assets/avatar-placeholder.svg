<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#141414"/>
    </radialGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#A1A1AA"/>
      <stop offset="100%" stop-color="#52525B"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="100" x2="400" y2="100" stroke="#303030" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="0" y1="200" x2="400" y2="200" stroke="#303030" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="0" y1="300" x2="400" y2="300" stroke="#303030" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="100" y1="0" x2="100" y2="400" stroke="#303030" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="200" y1="0" x2="200" y2="400" stroke="#303030" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="300" y1="0" x2="300" y2="400" stroke="#303030" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Geometric Silhouette / Monogram Structure -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#404040" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="110" fill="none" stroke="#2c2c2c" stroke-width="1"/>

  <!-- Professional Monogram "CMR" & Nodes -->
  <g transform="translate(130, 130)">
    <!-- Tech Nodes & Constellation -->
    <path d="M 20,110 L 20,30 L 70,80 L 120,30 L 120,110" fill="none" stroke="url(#silverGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="30" r="5" fill="#FFFFFF"/>
    <circle cx="70" cy="80" r="6" fill="#FFFFFF"/>
    <circle cx="120" cy="30" r="5" fill="#FFFFFF"/>
    <circle cx="20" cy="110" r="5" fill="#A1A1AA"/>
    <circle cx="120" cy="110" r="5" fill="#A1A1AA"/>
  </g>

  <!-- Clean Subtext -->
  <text x="200" y="310" text-anchor="middle" fill="#8A8A8A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="4">CHITTE MANOJ REDDY</text>
  <text x="200" y="328" text-anchor="middle" fill="#555555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="3">AI &amp; DATA ANALYTICS</text>
</svg>
